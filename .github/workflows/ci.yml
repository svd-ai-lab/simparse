name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ir-contract:
    name: AI Infra System IR contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/ir/requirements.txt
      - run: python -m unittest discover -s tests/ir -p 'test_*.py' -v
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p simparse-core --example ir_asset_probe
      - run: cargo build -p simparse-cli
      - run: python -m pip install -r tests/ir/requirements.txt
      - run: python scripts/check_ir_runtime.py --cli target/debug/simparse${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python -m pip install maturin
      - run: python -m maturin build --manifest-path crates/simparse-py/Cargo.toml --interpreter python
