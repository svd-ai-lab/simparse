[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "simparse"
version = "0.2.0"
description = "Lightweight metadata scanner for simulation project and case files."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "svd-ai-lab" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]

[tool.maturin]
manifest-path = "crates/simparse-py/Cargo.toml"
module-name = "simparse._simparse"
python-source = "python"
features = ["pyo3/extension-module"]
